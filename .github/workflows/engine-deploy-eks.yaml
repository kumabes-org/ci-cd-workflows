name: "Engine - Deploy EKS"

on:
  workflow_call:
    inputs:
      cluster-name:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: "default"
      deployment-name:
        required: true
        type: string
      container-name:
        required: true
        type: string
      image-uri:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "us-east-1"
    secrets:
      aws-role-arn:
        required: true

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ inputs.cluster-name }} --region ${{ inputs.aws-region }}

      - name: Deploy Image to EKS Deployment
        run: |
          kubectl set image deployment/${{ inputs.deployment-name }} \
            ${{ inputs.container-name }}=${{ inputs.image-uri }} \
            -n ${{ inputs.namespace }}
          kubectl rollout status deployment/${{ inputs.deployment-name }} \
            -n ${{ inputs.namespace }} \
            --timeout=180s
name: "Engine - Rust CI"

"on":
  workflow_call:
    inputs:
      rust-version:
        description: "Toolchain Rust usada no CI"
        required: false
        type: string
        default: "stable"
      working-directory:
        description: "Diretorio do projeto Rust"
        required: false
        type: string
        default: "."
      run-build:
        description: "Executa cargo build --locked"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ inputs.rust-version }}" --profile minimal
          rustup component add rustfmt clippy --toolchain "${{ inputs.rust-version }}"
          rustup default "${{ inputs.rust-version }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Build
        if: inputs.run-build
        run: cargo build --all-targets --all-features --locked

name: "Nested Entrypoint - Java CI/CD"

"on":
  workflow_call:
    inputs:
      target-platform:
        description: "Destino do deploy: ecs ou eks"
        required: true
        type: string
      app-name:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: "dev"
      java-version:
        required: false
        type: string
        default: "21"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"
          cache: "maven"
      - name: Run Maven Build & Test
        run: mvn clean verify --batch-mode

  build-image:
    needs: build-and-test
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-build-push-ecr.yaml@v1
    with:
      ecr-repository: "${{ inputs.app-name }}"
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy-ecs:
    needs: build-image
    if: inputs.target-platform == 'ecs'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-deploy-ecs.yaml@v1
    with:
      cluster-name: "${{ inputs.app-name }}-${{ inputs.environment }}-cluster"
      service-name: "${{ inputs.app-name }}-${{ inputs.environment }}-svc"
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy-eks:
    needs: build-image
    if: inputs.target-platform == 'eks'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-deploy-eks.yaml@v1
    with:
      cluster-name: "eks-${{ inputs.environment }}"
      namespace: "${{ inputs.app-name }}-${{ inputs.environment }}"
      deployment-name: "${{ inputs.app-name }}"
      container-name: "${{ inputs.app-name }}"
      image-uri: ${{ needs.build-image.outputs.image-uri }}
    secrets: inherit

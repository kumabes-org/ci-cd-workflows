name: "Harness - Workflow Engine Quality & Tests"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/harness/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Camada 1: Validação Estática e Sintaxe
  # -------------------------------------------------------------
  static-analysis:
    name: "Linter & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: {max: 180}, document-start: disable}}" .github/workflows/

      - name: Run actionlint with shellcheck
        uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: "-shellcheck="


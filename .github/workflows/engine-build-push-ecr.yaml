name: "Engine - Build and Push ECR"

"on":
  workflow_call:
    inputs:
      ecr-repository:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      dockerfile-path:
        required: false
        type: string
        default: "Dockerfile"
      build-context:
        required: false
        type: string
        default: "./app"
      aws-region:
        required: false
        type: string
        default: "us-east-1"
      working-directory:
        required: false
        type: string
        default: "app"
    outputs:
      image-uri:
        description: "URI completa da imagem gerada no ECR"
        value: ${{ jobs.build-push.outputs.image-uri }}

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  build-push:
    defaults:
      run:
        shell: bash
        working-directory: "${{ inputs.working-directory }}"
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.set-output.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          REPO_NAME: ${{ inputs.ecr-repository }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          echo "Verificando se o repositorio '$REPO_NAME' existe no ECR..."
          if ! aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Repositorio nao encontrado. Criando '$REPO_NAME'..."
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          else
            echo "Repositorio '$REPO_NAME' ja existe."
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bash
        run: |
          echo "Diretório atual ${PWD}"
          echo "Conteúdo do diretório:"
          ls -lrtha --color

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build-context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Output URI
        id: set-output
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT

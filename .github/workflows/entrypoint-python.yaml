name: "Nested Entrypoint - Python CI/CD"

"on":
  workflow_call:
    inputs:
      target-platform:
        description: "Destino do deploy: ecs, eks, lambda ou glue"
        required: true
        type: string
      app-name:
        required: true
        type: string
      environment:
        description: "Nome do ambiente (ex: dev, prod)"
        required: true
        type: string
      cluster-name:
        required: false
        type: string
        default: "default-cluster"
      aws-region:
        required: false
        type: string
        default: "us-east-1"
      working-directory:
        required: false
        type: string
        default: "app"

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Lint & Tests
        run: |
          pwd
          ls -lrth
          export PYTHONPATH=$(pwd)
          find . -type f -name requirements.txt -exec pip install -r {} \;
          pip install ruff pytest
          ruff check .
          pytest

  # Publish (ECR)
  publish-ecr:
    needs: quality-check
    if: inputs.target-platform == 'ecs'
    uses: ./.github/workflows/engine-build-push-ecr.yaml
    with:
      ecr-repository: ${{ inputs.app-name }}
      image-tag: ${{ github.sha }}
      aws-region: ${{ inputs.aws-region }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  # Deploy condicional para ECS
  deploy-ecs:
    needs: publish-ecr
    if: inputs.target-platform == 'ecs'
    uses: ./.github/workflows/engine-deploy-ecs.yaml
    with:
      cluster-name: "${{ inputs.cluster-name }}"
      service-name: "${{ inputs.app-name }}-${{ inputs.environment }}-svc"
      task-definition-family: "${{ inputs.app-name }}-${{ inputs.environment }}-tsk"
      container-name: "${{ inputs.app-name }}-${{ inputs.environment }}-ctr"
      image-uri: ${{ needs.publish-ecr.outputs.image-uri }}
    secrets: inherit

  # Deploy condicional para Lambda
  deploy-lambda:
    needs: quality-check
    if: inputs.target-platform == 'lambda'
    uses: ./.github/workflows/engine-deploy-lambda.yaml
    with:
      function-name: "${{ inputs.app-name }}-${{ inputs.environment }}-fn"
      package-type: "Zip"
    secrets: inherit

  # Deploy condicional para AWS Glue
  deploy-glue:
    needs: quality-check
    if: inputs.target-platform == 'glue'
    uses: ./.github/workflows/engine-deploy-glue.yaml
    with:
      job-name: "${{ inputs.app-name }}-${{ inputs.environment }}-etl"
      s3-bucket: "${{ inputs.app-name }}-${{ inputs.environment }}-etl"
      local-script-path: "src/etl/main.py"
    secrets: inherit

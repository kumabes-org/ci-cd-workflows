name: "Nested Entrypoint - Golang CI/CD"

on:
  workflow_call:
    inputs:
      target-platform:
        description: "Destino do deploy: ecs, eks ou lambda"
        required: true
        type: string
      app-name:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: "dev"
      go-version:
        required: false
        type: string
        default: "1.23"

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt ./...

  build-container:
    needs: quality-check
    if: inputs.target-platform == 'ecs' || inputs.target-platform == 'eks'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-build-push-ecr.yaml@v1
    with:
      ecr-repository: "${{ inputs.app-name }}"
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy-ecs:
    needs: build-container
    if: inputs.target-platform == 'ecs'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-deploy-ecs.yaml@v1
    with:
      cluster-name: "${{ inputs.app-name }}-${{ inputs.environment }}-cluster"
      service-name: "${{ inputs.app-name }}-${{ inputs.environment }}-svc"
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy-eks:
    needs: build-container
    if: inputs.target-platform == 'eks'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-deploy-eks.yaml@v1
    with:
      cluster-name: "eks-${{ inputs.environment }}"
      namespace: "${{ inputs.app-name }}-${{ inputs.environment }}"
      deployment-name: "${{ inputs.app-name }}"
      container-name: "${{ inputs.app-name }}"
      image-uri: ${{ needs.build-container.outputs.image-uri }}
    secrets: inherit

  package-lambda:
    needs: quality-check
    if: inputs.target-platform == 'lambda'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: Build Binary for Linux
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bootstrap main.go
          zip -j function.zip bootstrap
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-zip
          path: function.zip

  deploy-lambda:
    needs: package-lambda
    if: inputs.target-platform == 'lambda'
    uses: kumabes-org/ci-cd-workflows/.github/workflows/engine-deploy-lambda.yaml@v1
    with:
      function-name: "${{ inputs.app-name }}-${{ inputs.environment }}-fn"
      package-type: "Zip"
      artifact-path: "function.zip"
    secrets: inherit